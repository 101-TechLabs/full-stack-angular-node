name: Deploy Fullstack App to VPS

on:
  push:
    branches:
      - dev
      - qa
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "🚀 Starting deployment for branch: ${{ github.ref_name }}"

            cd /home/ubuntu/full-stack-angular-node

            git fetch origin
            git pull --rebase

            # ---------- ENV FILE SETUP ----------
            mkdir -p server

            if [ "${{ github.ref_name }}" = "dev" ]; then
              echo "${{ secrets.DEV_ENV_FILE }}" > server/.env.dev
              echo "Deploying DEV environment"
              docker compose up -d --build api-dev ui-dev
            fi

            if [ "${{ github.ref_name }}" = "qa" ]; then
              echo "${{ secrets.QA_ENV_FILE }}" > server/.env.qa
              echo "Deploying QA environment"
              docker compose up -d --build api-qa ui-qa
            fi

            if [ "${{ github.ref_name }}" = "main" ]; then
              echo "${{ secrets.PROD_ENV_FILE }}" > server/.env.prod
              echo "Deploying PROD environment"
              docker compose up -d --build api-prod ui-prod
            fi

            echo "✅ Deployment finished successfully"
