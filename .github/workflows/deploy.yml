name: Deploy Fullstack App to VPS

on:
  push:
    branches:
      - dev
      - qa
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "🚀 Starting clean deployment"

            cd /home/ubuntu/full-stack-angular-node

            # Update code
            git fetch origin
            git reset --hard origin/${GITHUB_REF_NAME}

            # ---------- ENV FILE SETUP ----------
            mkdir -p server
            cat <<EOF > server/.env.dev
            ${{ secrets.DEV_ENV_FILE }}
            EOF

                        cat <<EOF > server/.env.qa
            ${{ secrets.QA_ENV_FILE }}
            EOF

                        cat <<EOF > server/.env.prod
            ${{ secrets.PROD_ENV_FILE }}
            EOF

            echo "🧹 Cleaning up old containers and freeing ports"

            # Stop and remove all containers (for safety)
            docker ps -q | xargs -r docker stop
            docker ps -aq | xargs -r docker rm -f

            # Optional: remove old images to free space (uncomment if needed)
            # docker images -q | xargs -r docker rmi -f

            echo "📦 Building and starting new containers"
            docker compose up -d --build

            echo "✅ Deployment completed successfully"
