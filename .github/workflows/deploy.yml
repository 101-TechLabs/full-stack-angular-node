name: Deploy Fullstack App to VPS

on:
  push:
    branches:
      - dev
      - qa
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "🚀 Starting deployment (all environments)"

            cd /home/ubuntu/full-stack-angular-node

            git fetch origin
            git pull --rebase

            # ---------- ENV FILE SETUP ----------
            mkdir -p server

            echo "${{ secrets.DEV_ENV_FILE }}"  > server/.env.dev
            echo "${{ secrets.QA_ENV_FILE }}"   > server/.env.qa
            echo "${{ secrets.PROD_ENV_FILE }}" > server/.env.prod

            echo "📦 Deploying DEV + QA + PROD"

            docker compose down --remove-orphans
            docker compose up -d --build

            echo "✅ All environments deployed successfully"
